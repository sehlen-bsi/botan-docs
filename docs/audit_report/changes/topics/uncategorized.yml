# In ECIES require a fresh nonce be created for each message
#   Author:    @randombit
#   Approvals: (@reneme)
- pr: 5823  # https://github.com/randombit/botan/pull/5823
  merge_commit: 87bc86dc3df09ede96f5de601664aa437322d812
  auditer: falko-strenzke
  comment : |
    API-hardening against dangerous misuse. The problem of the previous implementation was: the ECIES ephemeral key pair is created in the ECIES_Encryptor constructor (ecies.cpp:282-302), so the derived DEM key is identical for every encrypt() call on the same object. Before this PR, m_iv persisted across calls — an application that reused one encryptor for several messages silently encrypted all of them with the same (key, IV) pair in the employed symmetric cipher.
  categories: quality
  classification: relevant

