# In randomize_with_ts_input prefer system RNG if available
#   Author:    @randombit
#   Approvals: (@reneme)
- pr: 5839  # https://github.com/randombit/botan/pull/5839
  merge_commit: 96e37b3527a9ee6fe23e5f8c7f3ce26f877655b6
  auditer: falko-strenzke
  categories: optimization
  comment : |
    The function `randomize_with_ts_input()` does not actually use anymore a time stamp or the process ID as input for RNG output generation if a System_RNG is available. This is a potential security degradation if the System_RNG is badly implemented and for instance is not properly handling a process fork and does not itself perform hedging against the repeated-state problem by incorporating a time stamp as input.
  classification: info

