# In TLS 1.2 ensure sensitive state is cleared after a fatal alert
#   Author:    @randombit
- pr: 5810  # https://github.com/randombit/botan/pull/5810
  merge_commit: 6ea60e144559ed99555fef78c5510b9d9e8349bf
  auditer: falko-strenzke
  categories: fixes, quality
  comment: |
    Adresses compliances gaps / security-harding. What the TLS 1.2 channel did wrong before:
      1. Fatally-terminated sessions stayed resumable — the clearest security defect. RFC 5246 §7.2.2 says a connection terminated with a fatal alert "MUST NOT be resumed" and the parties "MUST forget any session-identifiers, keys, and secrets". The old code only removed the cache entry for the active state's non-empty session ID; ticket-backed sessions and the freshly negotiated resumption handle were never invalidated. The PR tracks the handle explicitly (note_resumption_handle() in client and server) and invalidates both handles on fatal alert, in both the receive and send paths.
      2. Secrets outlived the connection — a fatal alert didn't call reset_state(), so cipher states, keys, and handshake state lingered; the channel wasn't marked closed, and e.g. key_material_export() remained callable (the PR adds an assert that it isn't). Now teardown happens immediately.
      3. Ordering hardening — teardown now completes before the tls_alert application callback and before touching application-supplied session storage (whose remove() may throw), so a misbehaving callback or session manager can't observe or preserve a channel that is still is_active() with live keys.
      4. Post-alert record handling — records after a fatal alert are no longer processed at all, and per RFC 5246 §7.2.1 non-alert data after a peer's close_notify is now ignored.
      5. One deliberate non-change: a local teardown with Alert::None (triggered by unauthenticated input, e.g. off-path garbage, or timeouts) does not evict resumption state — otherwise anyone able to reach the address could destroy the session cache.
  classification: relevant

