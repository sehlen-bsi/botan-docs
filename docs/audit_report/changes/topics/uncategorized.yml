# Add an explicit type for X509 certificate serial numbers
#   Author:    @randombit
- pr: 5740  # https://github.com/randombit/botan/pull/5740
  merge_commit: b591e66d72b47ff227b690bd8bd97b6bd08137ed
  auditer: falko-strenzke
  categories: fixes, pki, quality
  comment: |
    Review from Fable 5: "Introduces X509_Serial_Number (pkix_types.h, new x509_serial.cpp), storing the serial as the contents octets of its DER INTEGER encoding (two's complement, minimal length). That representation choice is the crux: it preserves the sign and makes byte-equality equal value-equality, whereas the previous code shuttled serials through BigInt::serialize()/BigInt::from_bytes(), which round-trips through the absolute value and silently conflates -N with +N. RFC 5280 §4.1.2.2 requires positive serials but instructs verifiers to gracefully handle non-conforming (negative/zero) ones, and Botan does parse them — so the sign loss was a real, if exotic, correctness gap."
  classification: relevant

