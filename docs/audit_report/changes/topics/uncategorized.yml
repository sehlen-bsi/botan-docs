# Make OCSP "soft fail" conditions errors unless specifically opted into
#   Author:    @randombit
#   Approvals: (@FAlbertDev), (@reneme)
- pr: 5804  # https://github.com/randombit/botan/pull/5804
  merge_commit: 38bb4bff9873f69e285fad083e00a8f8699f407f
  auditer: falko-strenzke
  comment: |
    flips Botan's OCSP failure semantics from soft-fail to hard-fail by default. Four concrete changes:
    1. Soft-fail no longer satisfies revocation requirements. The core is in PKIX::merge_revocation_status(). Previously, the codes OCSP_NO_REVOCATION_URL and OCSP_SERVER_NOT_AVAILABLE counted as "had OCSP" — so with require_revocation_information=true, an unreachable responder or a certificate without an OCSP URL silently satisfied the revocation requirement. That's the classic soft-fail weakness: an attacker who can block the OCSP connection thereby disables revocation checking. Now the code distinguishes definitive outcomes (OCSP_RESPONSE_GOOD, CERT_IS_REVOKED) from soft-fail conditions (OCSP_NO_REVOCATION_URL, OCSP_SERVER_NOT_AVAILABLE, OCSP_NO_HTTP), and soft-fail only counts if the application explicitly set the new restriction flag. Otherwise had_ocsp stays false and — when revocation information is required — the chain gets NO_REVOCATION_DATA, i.e. validation fails.
    2. Explicit opt-in via Path_Validation_Restrictions. Both constructors gained a trailing parameter accept_ocsp_softfail = false, documented with "Not recommended". Only setting it true restores the old lenient behavior. The flag is also propagated into the recursive validation of delegated OCSP responder certificates (verify_ocsp_signing_cert).
    3. Unsigned OCSP error responses are treated as "server not available". In check_ocsp_online(), a response whose OCSP::Response_Status_Code is not Successful (e.g. tryLater, internalError — per RFC 6960 §2.3 these error messages are not signed) is no longer processed as a response at all; it's replaced by the dummy server-not-available response and therefore falls under the same soft-fail handling. Previously such a body was parsed and carried forward as a real Response object.
    4. OCSP_NO_HTTP reclassified. This status (library built without HTTP support) sat in the success range of Certificate_Status_Code (value 4, below FIRST_WARNING_STATUS); it's moved to the warning range (506) and included in the soft-fail set — so "we couldn't even attempt the OCSP fetch" is no longer a success-flavored code.
  categories: quality, pki
  classification: relevant

