# Remove signature check for detecting self-signed vs self-issued certs
#   Author:    @randombit
- pr: 5515  # https://github.com/randombit/botan/pull/5515
  merge_commit: 73b945e271934a844b01c9e9d7c4b0d67c60ed5a
  classification: relevant
  auditer: falko-strenzke
  categories: pki, optimization
  comment: |
    Summary from Claude/Fable 5: For a certificate where subject DN == issuer DN but the SKID and AKID extensions are not both present, the parser previously loaded the certificate's own public key and cryptographically verified the certificate's signature with it — signature OK (or unknown algorithm) meant "self-signed", a failed verification meant "self-issued but not self-signed".  That verification was removed. Now such a certificate is unconditionally flagged as self-signed. The SKID == AKID comparison path (when both extensions are present) is unchanged.

