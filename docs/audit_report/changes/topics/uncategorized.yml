# Improve X509 certificate path building limits
#   Author:    @randombit
- pr: 5698  # https://github.com/randombit/botan/pull/5698
  merge_commit: b2d983cbab3acfe86d50520cf06eb34b1fac4c04
  auditer: falko-strenzke
  categories: pki
  comment: |
    Hardening against DoS via certificate flooding in path validation. Summary from Fable 5: "Botan's path builder is a lazy DFS (CertificatePathBuilder::next() yields candidate chains one at a time) over the graph of end-entity + supplied intermediates + trust stores. Before this PR, its work limit was broken in a subtle way: MAX_DFS_STEPS = 1000 was a local variable reset on every next() call. Since the callers invoke next() in a loop — up to 50 paths in x509_path_validate, and until exhaustion in build_all_certificate_paths — the total DFS work was per-call limit × number of calls. An attacker who supplies a dense mesh of cross-signed intermediates (e.g. in a TLS handshake's certificate list) could thus drive tens of thousands of node expansions, each involving certificate-store lookups and issuer matching: a work-amplification DoS against the verifier. There was also no bound on the length of an emitted chain, so absurdly long paths would be handed to check_chain, where every element costs a signature verification."
  classification: relevant

