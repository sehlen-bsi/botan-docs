# test and fix for Ed25519 good-after-bad verify problem
#   Author:    @falko-strenzke
#   Approvals: (@randombit)
- pr: 5454  # https://github.com/randombit/botan/pull/5454
  merge_commit: a2d9ecf60bf9a07250025ed7c90c46eae6829634
  classification: critical 
  auditer: falko-strenzke
  categories: fixes
  comment: |
    Fixes the "good-after-bad signature verification" issue for Ed25519: after an attempt to verify an invalid signature with a specific format, the verifier object remained in a state with a pending message in its internal hasher, thus enabling effectively signature forgeries in this state: the received message would be different from the verified message in this case.

