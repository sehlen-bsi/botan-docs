  merge_commit: 63d9957034307dc4ed797187b6262bb013c4cc5e
  auditer: falko-strenzke
  classification:  info

# Update EC_Group::PEM_encode to handle upcoming removal of explicit curves
#   Author:    @randombit
- pr: 4840  # https://github.com/randombit/botan/pull/4840
  merge_commit: 54b3ab9c712785987ef76f47e74dac33b0e4f390
  auditer: falko-strenzke
  classification:  info
  comment: |
    Botan 4 will completely remove explicit encoding of EC domain parameters and will only support named curves. This change introduces the for choice for encoding them as named curves and adds a warning to the API doc that the explicit encoding will be removed.

