title: API Enhancements and Modifications

description: |
  This section lists changes to Botan's API.

patches:

# Custom ECDH adapter in TLS 1.2 must no-longer derive from `ECDH_PublicKey`
#   Author:    @reneme
#   Approvals: (@jdoubleu), (@randombit)
