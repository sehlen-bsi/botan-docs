title: Code Chores and Cleanups

description: |
  Generic maintenance of the library without changing its features or security
  properties significantly. This includes removal of outdated code, measures to
  ensure future-proofness or to facilitate future extensions or adaptations of
  the API as well as updates to 3rd-party tools, e.g., those used in the test
  framework.  It further includes fixes of the code for specific tool chains or
  architectures as well as other minor additions without a significant expected
  effect on program execution.

